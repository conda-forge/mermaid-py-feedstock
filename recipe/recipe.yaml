schema_version: 1

context:
  name: mermaid-py
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mermaid_py-${{ version }}.tar.gz
  sha256: 35080d4fed4680a4d598e8e2da967ba96d175b564f9101f46915fef273d14dbd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
  run:
    - python >=${{ python_min }}
    - requests >=2.32.5

tests:
  - python:
      imports:
        - mermaid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple interface for the the famous lib mermaid-js to create diagrams.
  license: MIT
  license_file: LICENSE
  homepage: https://mermaidpy.vercel.app
  repository: https://github.com/ouhammmourachid/mermaid-py

extra:
  recipe-maintainers:
    - thewchan
